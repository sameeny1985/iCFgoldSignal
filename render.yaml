services:
  - type: web
    name: atr3-bot
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

    healthCheckPath: /health

    envVars:
      - key: SYMBOL
        value: BTCUSDT

      - key: TICKER_INTERVAL
        value: "1"

      - key: TELEGRAM_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false
